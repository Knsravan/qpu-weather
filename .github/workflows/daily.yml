name: Daily quantum weather report

on:
  schedule:
    - cron: "17 3 * * *"   # once a day, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run experiment on a real IBM quantum computer
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN }}
          IBM_INSTANCE: ${{ secrets.IBM_INSTANCE }}   # optional, only if IBM requires it
          IBM_BACKEND: ${{ vars.IBM_BACKEND }}   # optional, empty = least busy
        run: |
          if [ -z "$IBM_QUANTUM_TOKEN" ]; then
            echo "::error::Add the IBM_QUANTUM_TOKEN repository secret first (see README)."
            exit 1
          fi
          if [ -n "$IBM_BACKEND" ]; then
            qpu-weather run --backend "$IBM_BACKEND"
          else
            qpu-weather run
          fi

      - name: Rebuild dashboard data
        run: qpu-weather aggregate

      - name: Commit results
        run: |
          git config user.name "qpu-weather-bot"
          git config user.email "qpu-weather-bot@users.noreply.github.com"
          git add data/runs docs/data/history.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: daily run $(date -u +%F)"
            git push
          fi
