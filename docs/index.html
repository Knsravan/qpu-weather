<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Weather Report</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#14181f; --muted:#5b6575; --line:#e3e7ee;
    --a:#2f5bea; --b:#d9534f; --ok:#1e8e5a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --card:#161b22; --ink:#e8ecf2; --muted:#93a0b3; --line:#262d38;
            --a:#7ea2ff; --b:#ff8a84; --ok:#4cc38a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.9rem; margin:0 0 4px; }
  h2 { font-size:1.1rem; margin:0 0 12px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .big { font-size:1.6rem; font-weight:650; }
  .muted { color:var(--muted); font-size:.9rem; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  td.n,th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .chips span { display:inline-block; background:var(--bg); border:1px solid var(--line);
                border-radius:999px; padding:2px 10px; margin:2px 4px 2px 0; font-weight:600; }
  .empty { text-align:center; padding:48px 16px; }
  svg text { fill:var(--muted); font-size:11px; }
  .bar { fill:var(--a); } .bar.best { fill:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Quantum Weather Report</h1>
  <p class="sub">An independent daily check of a real IBM quantum computer: how it actually behaves, and which fixes help most.</p>
  <div id="app"><div class="card empty">Loading…</div></div>
</main>
<script>
const $ = (t, props = {}, ...kids) => {
  const e = document.createElement(t);
  Object.entries(props).forEach(([k, v]) => k === "class" ? e.className = v : e.setAttribute(k, v));
  kids.flat().forEach(k => e.append(k.nodeType ? k : document.createTextNode(String(k))));
  return e;
};
const pct = x => x == null ? "–" : (x * 100).toFixed(2) + "%";
const med = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1;
                   return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

function lineChart(points, labels) {
  // points: [{name, color, values[]}]; simple SVG, no libraries
  const W = 520, H = 200, L = 46, R = 10, T = 10, B = 26;
  const all = points.flatMap(p => p.values).filter(v => v != null);
  const max = Math.max(...all) * 1.15 || 1;
  const x = i => L + (labels.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (labels.length - 1));
  const y = v => T + (1 - v / max) * (H - T - B);
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", "100%");
  const add = (n, a, txt) => { const e = document.createElementNS(NS, n);
    Object.entries(a).forEach(([k, v]) => e.setAttribute(k, v)); if (txt) e.textContent = txt;
    svg.append(e); return e; };
  [0, .5, 1].forEach(f => { const v = max * f;
    add("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "currentColor", "stroke-opacity": .12 });
    add("text", { x: 4, y: y(v) + 4 }, pct(v)); });
  [0, labels.length - 1].forEach(i => add("text", { x: x(i), y: H - 6, "text-anchor": i ? "end" : "start" }, labels[i]));
  points.forEach(p => {
    const d = p.values.map((v, i) => v == null ? "" : `${i ? "L" : "M"}${x(i)},${y(v)}`).join("");
    add("path", { d, fill: "none", stroke: p.color, "stroke-width": 2.2 });
    p.values.forEach((v, i) => v != null && add("circle", { cx: x(i), cy: y(v), r: 3, fill: p.color }));
  });
  return svg;
}

async function main() {
  const app = document.getElementById("app");
  let hist;
  try { hist = await (await fetch("data/history.json", { cache: "no-store" })).json(); }
  catch { app.replaceChildren($("div", { class: "card empty" }, "Could not load data/history.json")); return; }
  const runs = hist.runs || [];
  if (!runs.length) {
    app.replaceChildren($("div", { class: "card empty" },
      $("h2", {}, "No real quantum-computer runs yet"),
      $("p", { class: "muted" }, "Nothing is shown until a real QPU run is recorded. Simulator results are never published here.")));
    return;
  }
  const last = runs[runs.length - 1];
  const cards = [];

  // today's advice
  cards.push($("div", { class: "card" },
    $("h2", {}, "Today's advice"),
    $("div", { class: "muted" }, `${last.backend} · ${last.timestamp_utc.slice(0, 16).replace("T", " ")} UTC`),
    $("p", {}, "Use these qubits (best connected chain, by measured error):"),
    $("div", { class: "chips" }, last.layouts.best.chain.map(q => $("span", {}, "q" + q))),
    $("p", { class: "muted" }, `Chain cost ${last.layouts.best.cost.toFixed(3)} vs ${last.layouts.naive.cost.toFixed(3)} for simply taking the first qubits (lower is better).`)));

  // measured vs reported
  const s = last.calibration_summary;
  const ratio = s.median_readout_measured_over_reported;
  cards.push($("div", { class: "card" },
    $("h2", {}, "Does reality match the datasheet?"),
    $("div", { class: "big" }, ratio == null ? "–" : ratio.toFixed(2) + "×"),
    $("div", { class: "muted" }, "median measured readout error ÷ vendor-reported. 1.0× means they agree; above 1 means the chip is worse than advertised."),
    $("p", { class: "muted" }, "Worst offenders: " + (s.worst_readout_qubits || []).slice(0, 3)
      .map(w => `q${w.qubit} (${pct(w.measured)} vs ${pct(w.reported)})`).join(", "))));

  // which fix works best (all runs)
  const methods = ["raw", "readout", "zne", "readout+zne"];
  const rows = methods.map(m => {
    const sc = runs.flatMap(r => r.results.filter(x => x.layout === "best").map(x => x.scores[m]));
    return { m, mean: sc.reduce((a, b) => a + b, 0) / sc.length, n: sc.length };
  });
  const bestM = rows.reduce((a, b) => b.mean > a.mean ? b : a);
  const raw = rows[0];
  cards.push($("div", { class: "card", style: "grid-column:1/-1" },
    $("h2", {}, "Which error fix works best?"),
    $("div", { class: "muted" }, "Average score on benchmarks with a known correct answer (1.0 = perfect), over all recorded runs, on the best chain."),
    $("table", {},
      $("thead", {}, $("tr", {}, $("th", {}, "Method"), $("th", { class: "n" }, "Avg score"), $("th", { class: "n" }, "Error vs raw"))),
      $("tbody", {}, rows.map(r => $("tr", {},
        $("td", {}, r.m + (r === bestM ? "  ← best" : "")),
        $("td", { class: "n" }, r.mean.toFixed(3)),
        $("td", { class: "n" }, r.m === "raw" ? "–" : (100 * ((1 - r.mean) - (1 - raw.mean)) / (1 - raw.mean)).toFixed(0) + "%")))))));

  // drift
  const labels = runs.map(r => r.timestamp_utc.slice(5, 10));
  const measured = runs.map(r => med(r.qubits.map(q => q.ro)));
  const reported = runs.map(r => { const v = r.qubits.map(q => q.ro_rep).filter(x => x != null); return v.length ? med(v) : null; });
  cards.push($("div", { class: "card", style: "grid-column:1/-1" },
    $("h2", {}, "Drift: median readout error over time"),
    $("div", { class: "muted" }, "Blue = what we measured. Red = what the vendor reports. " + runs.length + " run(s) recorded."),
    lineChart([{ name: "measured", color: "var(--a)", values: measured },
               { name: "reported", color: "var(--b)", values: reported }], labels)));

  // per qubit table
  const qs = [...last.qubits].sort((a, b) => a.ro - b.ro);
  const pick = [...qs.slice(0, 5), ...qs.slice(-5)];
  cards.push($("div", { class: "card", style: "grid-column:1/-1" },
    $("h2", {}, "Five best and five worst qubits today"),
    $("table", {},
      $("thead", {}, $("tr", {}, ["Qubit", "Readout (measured)", "Readout (reported)", "1q gate (measured)", "1q gate (reported)"]
        .map((h, i) => $("th", i ? { class: "n" } : {}, h)))),
      $("tbody", {}, pick.map(q => $("tr", {}, $("td", {}, "q" + q.q),
        [q.ro, q.ro_rep, q.g1, q.g1_rep].map(v => $("td", { class: "n" }, pct(v)))))))));

  app.replaceChildren($("div", { class: "grid" }, cards),
    $("p", { class: "muted", style: "margin-top:16px" },
      "Scores are the probability of the known-correct output. Two-qubit gate errors used for choosing a chain come from a quick repeated-gate decay test (an estimate, not randomized benchmarking)."));
}
main();
</script>
</body>
</html>
