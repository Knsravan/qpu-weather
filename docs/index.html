<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Quantum Weather Report</title>
<style>
  /* ---------- tokens: dark glass by default, light glass for light mode or the toggle ---------- */
  :root {
    --bg:#060912; --ink:#eef2f8; --muted:#97a3ba; --a:#7ea2ff; --b:#ff9a8f; --good:#4cc38a; --warn:#f0b35a; --bad:#ff6b86;
    --tint:rgba(255,255,255,.055); --tint2:rgba(255,255,255,.10); --rim:rgba(255,255,255,.30); --rim-lo:rgba(255,255,255,.05);
    --hi:rgba(255,255,255,.26); --sheen:rgba(255,255,255,.13); --shadow:rgba(0,0,0,.55); --line:rgba(255,255,255,.10);
    --blob1:#2f5bea; --blob2:#8b5cf6; --blob3:#14b8a6; --blob-o:.5; --track:rgba(255,255,255,.08);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#e9eef8; --ink:#111827; --muted:#4b5870; --a:#2f5bea; --b:#d9534f; --good:#0e7a53; --warn:#b26a00; --bad:#bd2b4a;
      --tint:rgba(255,255,255,.45); --tint2:rgba(255,255,255,.7); --rim:rgba(255,255,255,.95); --rim-lo:rgba(255,255,255,.35);
      --hi:rgba(255,255,255,.95); --sheen:rgba(255,255,255,.7); --shadow:rgba(30,45,70,.18); --line:rgba(20,30,60,.12);
      --blob1:#7aa2ff; --blob2:#c4a4ff; --blob3:#6fe0cf; --blob-o:.55; --track:rgba(20,30,60,.08);
      color-scheme: only light;
    }
  }
  :root[data-theme="light"] {
    --bg:#e9eef8; --ink:#111827; --muted:#4b5870; --a:#2f5bea; --b:#d9534f; --good:#0e7a53; --warn:#b26a00; --bad:#bd2b4a;
    --tint:rgba(255,255,255,.45); --tint2:rgba(255,255,255,.7); --rim:rgba(255,255,255,.95); --rim-lo:rgba(255,255,255,.35);
    --hi:rgba(255,255,255,.95); --sheen:rgba(255,255,255,.7); --shadow:rgba(30,45,70,.18); --line:rgba(20,30,60,.12);
    --blob1:#7aa2ff; --blob2:#c4a4ff; --blob3:#6fe0cf; --blob-o:.55; --track:rgba(20,30,60,.08);
    color-scheme: only light;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
         font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }

  /* ---------- the ground: slow drifting colour, so the glass has something to refract ---------- */
  .ground { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .blob { position:absolute; width:52vmax; height:52vmax; border-radius:50%; filter:blur(90px); opacity:var(--blob-o); will-change:transform; }
  .blob.b1 { background:var(--blob1); left:-14vmax; top:-16vmax; animation:drift1 34s ease-in-out infinite alternate; }
  .blob.b2 { background:var(--blob2); right:-18vmax; top:18vh; animation:drift2 42s ease-in-out infinite alternate; }
  .blob.b3 { background:var(--blob3); left:22vw; bottom:-26vmax; animation:drift3 38s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform:translate(14vmax,10vmax) scale(1.15); } }
  @keyframes drift2 { to { transform:translate(-12vmax,-8vmax) scale(.9); } }
  @keyframes drift3 { to { transform:translate(10vmax,-10vmax) scale(1.2); } }

  /* ---------- glass surfaces ---------- */
  .pane, .bar { position:relative; isolation:isolate; background:var(--tint);
    -webkit-backdrop-filter:blur(18px) saturate(1.7); backdrop-filter:blur(18px) saturate(1.7);
    box-shadow:inset 0 1px 0 var(--hi), inset 0 -1px 1px var(--rim-lo), 0 18px 50px -24px var(--shadow); }
  .pane { border-radius:26px; padding:22px; }
  .pane::before, .bar::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
    background:radial-gradient(300px circle at var(--mx,25%) var(--my,0%), var(--sheen), transparent 70%); }
  .pane::after, .bar::after { content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none; z-index:3;
    background:linear-gradient(140deg, var(--rim), transparent 38%, transparent 62%, var(--rim-lo));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }

  /* ---------- floating toolbar ---------- */
  .bar { position:fixed; z-index:20; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translateX(-50%);
    display:flex; gap:2px; padding:5px; border-radius:999px; width:max-content; max-width:calc(100% - 20px); overflow-x:auto; scrollbar-width:none; }
  .bar::-webkit-scrollbar { display:none; }
  .lens .bar { -webkit-backdrop-filter:blur(4px) saturate(1.8); backdrop-filter:url(#lg-liquid) blur(4px) saturate(1.8); }
  .pill { display:inline-flex; align-items:center; gap:.45em; background:transparent; color:var(--ink); border:0; border-radius:999px;
    padding:8px 13px; font-weight:500; font-size:13px; line-height:1; font-family:inherit; cursor:pointer; text-decoration:none; white-space:nowrap;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), background .3s, color .3s; will-change:transform; }
  .pill:hover { background:var(--tint2); }
  .pill.on { background:var(--tint2); color:var(--a); box-shadow:inset 0 1px 0 var(--hi); }
  .pill:focus-visible, select:focus-visible { outline:2px solid var(--a); outline-offset:2px; }
  .brand { font-weight:700; }
  .progress { position:fixed; left:0; top:0; width:100%; height:2px; z-index:30; transform-origin:0 50%; transform:scaleX(var(--p,0));
    background:linear-gradient(90deg, var(--good), var(--a) 55%, var(--b)); pointer-events:none; }

  /* ---------- layout ---------- */
  main { max-width:1040px; margin:0 auto; padding:92px 16px 72px; }
  h1 { font-size:clamp(2rem,6vw,3.1rem); line-height:1.08; margin:0 0 10px; letter-spacing:-.02em; }
  h2 { font-size:1.08rem; margin:0 0 4px; letter-spacing:.01em; }
  .sub { color:var(--muted); max-width:62ch; margin:0 0 16px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:4px 11px; border-radius:999px; font-size:13px; font-variant-numeric:tabular-nums;
    border:1px solid var(--line); background:var(--tint); box-shadow:inset 0 1px 0 var(--hi); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 var(--good); animation:ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 80%,100% { box-shadow:0 0 0 9px transparent; } }
  select { font:inherit; font-size:13px; color:var(--ink); background:var(--tint2); border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; }
  select option { color:#111; }
  /* run picker: a glass menu instead of the browser's plain dropdown */
  .rp { position:relative; z-index:40; }
  .rp-btn { font:inherit; font-size:13px; color:var(--ink); display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:var(--tint2); box-shadow:inset 0 1px 0 var(--hi); font-variant-numeric:tabular-nums; }
  .rp-btn:hover { border-color:var(--rim); }
  .rp-btn:focus-visible, .rp-opt:focus-visible { outline:2px solid var(--a); outline-offset:2px; }
  .rp-btn .cv { width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-2px) rotate(45deg); transition:transform .2s; }
  .rp.open .rp-btn .cv { transform:translateY(1px) rotate(225deg); }
  .rp-menu { position:absolute; left:0; top:calc(100% + 8px); min-width:290px; max-width:calc(100vw - 32px); max-height:min(60vh, 420px); overflow:auto;
    padding:6px; border-radius:16px; border:1px solid var(--rim); background:color-mix(in srgb, var(--bg) 78%, transparent);
    -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6); box-shadow:0 18px 40px -12px var(--shadow), inset 0 1px 0 var(--hi);
    opacity:0; transform:translateY(-6px) scale(.98); transform-origin:top left; pointer-events:none; transition:opacity .16s, transform .16s; }
  .rp.open .rp-menu { opacity:1; transform:none; pointer-events:auto; }
  .rp-grp { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 10px 4px; }
  .rp-opt { display:grid; grid-template-columns:16px 1fr auto; align-items:center; gap:8px; width:100%; text-align:left; font:inherit; font-size:13.5px;
    color:var(--ink); background:transparent; border:0; border-radius:10px; padding:8px 10px; cursor:pointer; font-variant-numeric:tabular-nums; }
  .rp-opt:hover, .rp-opt.act { background:var(--tint2); }
  .rp-opt[aria-selected="true"] { background:color-mix(in srgb, var(--a) 18%, transparent); }
  .rp-opt .ck { color:var(--a); font-weight:700; visibility:hidden; } .rp-opt[aria-selected="true"] .ck { visibility:visible; }
  .rp-opt small { color:var(--muted); font-size:11.5px; }
  .rp-tag { font-size:10.5px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--good); }
  @media (prefers-reduced-motion: reduce) { .rp-menu, .rp-btn .cv { transition:none; } }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(12,1fr); margin-top:20px; }
  .c6 { grid-column:span 6; } .c12 { grid-column:1/-1; }
  @media (max-width:820px) { .c6 { grid-column:1/-1; } .pane { padding:18px; } }
  section.pane { scroll-margin-top:84px; }

  /* split heading */
  [data-split] .w { display:inline-block; white-space:nowrap; }
  [data-split] .ch { display:inline-block; transition:opacity .8s ease, transform 1s cubic-bezier(.16,.9,.2,1), filter .8s ease; transition-delay:calc(var(--c,0) * 24ms + 60ms); }
  .armed [data-split]:not(.in) .ch { opacity:0; transform:translateY(.6em) rotate(6deg); filter:blur(5px); }

  /* reveal on scroll: visible until the script arms the page */
  .rv { transition:opacity .8s ease, transform .9s cubic-bezier(.16,.9,.2,1); transition-delay:var(--d,0s); }
  .armed .rv:not(.in) { opacity:0; transform:translateY(22px); }

  /* big numbers and meters */
  .big { font-size:clamp(2.2rem,6vw,3.2rem); font-weight:700; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .meter { position:relative; height:10px; border-radius:99px; background:var(--track); margin:22px 0 6px; }
  .meter::before { content:""; position:absolute; left:50%; top:-5px; bottom:-5px; width:2px; background:var(--muted); opacity:.5; }
  .meter .mk { position:absolute; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; left:var(--x,50%);
    background:var(--a); box-shadow:0 0 0 4px color-mix(in srgb, var(--a) 25%, transparent), 0 0 18px var(--a); transition:left 1.4s cubic-bezier(.2,.8,.2,1) .2s; }
  .armed .rv:not(.in) .meter .mk { left:50%; }
  .meter-l { display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); }

  .bar2 { height:12px; border-radius:99px; background:var(--track); overflow:hidden; }
  .bar2 > i { display:block; height:100%; border-radius:inherit; width:var(--w,0%); background:var(--c,var(--a));
    transition:width 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s); }
  .armed .rv:not(.in) .bar2 > i { width:0; }
  .fx { display:grid; grid-template-columns:130px 1fr 215px; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .fx:last-child { border-bottom:0; }
  .fx .nm { font-weight:600; } .fx .nm small { display:block; font-weight:400; color:var(--muted); font-size:.78rem; }
  .fx .vl { text-align:right; font-variant-numeric:tabular-nums; font-size:.92rem; }
  .fx.best .nm::after { content:" ★ best"; color:var(--good); font-size:.78rem; }
  .fx.best .bar2 > i { box-shadow:0 0 16px color-mix(in srgb, var(--good) 70%, transparent); }
  @media (max-width:640px) { .fx { grid-template-columns:1fr; gap:4px; } .fx .vl { text-align:left; } }

  /* the qubit chain */
  .chain { width:100%; height:auto; display:block; margin:10px 0 4px; overflow:visible; }
  .chain .wire { stroke:var(--a); stroke-width:4; fill:none; opacity:.35; }
  .chain .flow { stroke:var(--a); stroke-width:4; fill:none; stroke-linecap:round; stroke-dasharray:2 22; animation:flow 1.6s linear infinite; filter:drop-shadow(0 0 5px var(--a)); }
  @keyframes flow { to { stroke-dashoffset:-48; } }
  .chain .nd { fill:var(--tint2); stroke:var(--a); stroke-width:1.5; filter:drop-shadow(0 0 8px color-mix(in srgb, var(--a) 55%, transparent)); }
  .chain text { fill:var(--ink); font:600 21px system-ui,sans-serif; text-anchor:middle; }
  .chain text.s { fill:var(--muted); font-weight:400; font-size:16px; }
  .nodeg { transform-box:fill-box; transform-origin:center; animation:pop .6s cubic-bezier(.2,1.3,.4,1) both; animation-delay:calc(var(--i) * 90ms + .2s); }
  @keyframes pop { from { opacity:0; transform:scale(.3); } }
  .armed .rv:not(.in) .nodeg { animation:none; opacity:0; }

  /* worst offenders and qubit rows */
  .qr { display:grid; grid-template-columns:54px 1fr 1fr; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; font-size:.9rem; }
  .qr:last-child { border-bottom:0; }
  .qr .id { font-weight:700; }
  .qr small { display:block; color:var(--muted); font-size:.75rem; margin-bottom:2px; }
  .qh { display:grid; grid-template-columns:54px 1fr 1fr; gap:12px; color:var(--muted); font-size:.78rem; padding-bottom:4px; }
  .qr .g { display:flex; justify-content:space-between; gap:8px; margin-top:3px; font-size:.78rem; color:var(--muted); }
  @media (max-width:640px) { .qr, .qh { grid-template-columns:44px 1fr; } .qr > :nth-child(3), .qh > :nth-child(3) { grid-column:2; } }
  .legend { display:flex; flex-wrap:wrap; gap:12px; font-size:.8rem; color:var(--muted); margin:6px 0 10px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .note { font-size:.8rem; color:var(--muted); margin:8px 0 0; }
  table.sc { width:100%; border-collapse:collapse; font-size:.88rem; font-variant-numeric:tabular-nums; }
  table.sc th, table.sc td { text-align:left; padding:5px 6px 5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  table.sc th { color:var(--muted); font-weight:500; } table.sc small { display:block; color:var(--muted); font-size:.74rem; }

  /* chart */
  .chartwrap { position:relative; }
  .chartwrap svg { width:100%; height:auto; display:block; overflow:visible; }
  .chartwrap text { fill:var(--muted); font-size:14px; }
  .ln { fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:0; transition:stroke-dashoffset 1.8s cubic-bezier(.3,.7,.2,1) .2s; }
  .ln.rep { stroke-dasharray:6 6; }
  .ln.draw { stroke-dasharray:1; }
  .armed .rv:not(.in) .ln.draw { stroke-dashoffset:1; }
  .tip { position:absolute; pointer-events:none; z-index:5; padding:8px 11px; border-radius:12px; font-size:.82rem; line-height:1.4; white-space:nowrap;
    background:var(--tint2); border:1px solid var(--line); box-shadow:0 10px 30px -10px var(--shadow); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    opacity:0; transform:translate(-50%, -110%); transition:opacity .15s; }
  .tip.on { opacity:1; }
  .empty { text-align:center; padding:56px 16px; }
  .foot { margin-top:18px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior:auto; }
    .blob, .dot, .chain .flow, .nodeg { animation:none !important; }
    .rv, .pill, [data-split] .ch, .bar2 > i, .meter .mk, .ln { transition:none !important; }
    .armed .rv:not(.in), .armed [data-split]:not(.in) .ch { opacity:1; transform:none; filter:none; }
    .armed .rv:not(.in) .bar2 > i { width:var(--w); } .armed .rv:not(.in) .ln.draw { stroke-dashoffset:0; }
    .armed .rv:not(.in) .meter .mk { left:var(--x); } .armed .rv:not(.in) .nodeg { opacity:1; }
  }
</style>
</head>
<body>
<div class="ground" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<div class="progress" aria-hidden="true"></div>

<nav class="bar" aria-label="Sections">
  <span class="pill brand">QWR</span>
  <a class="pill" href="#advice">Advice</a>
  <a class="pill" href="#datasheet">Datasheet</a>
  <a class="pill" href="#fixes">Fixes</a>
  <a class="pill" href="#drift">Drift</a>
  <a class="pill" href="#qubits">Qubits</a>
  <a class="pill" href="explain.html">Explained</a>
  <button class="pill" id="theme" type="button" aria-label="Toggle light and dark mode">Theme</button>
</nav>

<main>
  <header>
    <h1 data-split>Quantum Weather Report</h1>
    <p class="sub">An independent, regularly repeated check of a real IBM quantum computer: how it actually behaves, and which fixes help most.</p>
    <div class="row" id="status"></div>
  </header>
  <div id="app" class="grid"><div class="pane c12 empty">Loading…</div></div>
</main>

<script>
const NS = "http://www.w3.org/2000/svg";
const $ = (t, props = {}, ...kids) => {
  const ns = props.ns; const e = ns ? document.createElementNS(ns, t) : document.createElement(t);
  Object.entries(props).forEach(([k, v]) => { if (k === "ns") return; if (k === "class") e.setAttribute("class", v); else e.setAttribute(k, v); });
  kids.flat().forEach(k => { if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k))); });
  return e;
};
const S = (t, p = {}, ...k) => $(t, { ns: NS, ...p }, ...k);
const pct = (x, d = 2) => x == null ? "n/a" : (x * 100).toFixed(d) + "%";
const med = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const tone = e => e == null ? "var(--muted)" : e < 0.01 ? "var(--good)" : e < 0.05 ? "var(--warn)" : "var(--bad)";
const root = document.documentElement;
let hist = null, runs = [], sel = 0, firstDraw = true;

/* ---------- count-up numbers ---------- */
function countUp(el, to, fmt, ms = 1300) {
  if (reduced()) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- the qubit chain graphic ---------- */
function chainSvg(run) {
  const chain = run.layouts.best.chain, W = 600, H = 150, pad = 52, by = {};
  run.qubits.forEach(q => by[q.q] = q);
  const x = i => pad + i * (W - 2 * pad) / (chain.length - 1), y = 62;
  const d = chain.map((_, i) => `${i ? "L" : "M"}${x(i)},${y}`).join("");
  const svg = S("svg", { viewBox: `0 0 ${W} ${H}`, class: "chain", role: "img", "aria-label": "Recommended qubit chain: " + chain.map(q => "q" + q).join(", ") });
  svg.append(S("path", { d, class: "wire" }), S("path", { d, class: "flow" }));
  chain.forEach((q, i) => {
    const g = S("g", { class: "nodeg", style: `--i:${i}` });
    g.append(S("circle", { cx: x(i), cy: y, r: 34, class: "nd" }),
             S("text", { x: x(i), y: y + 7 }, "q" + q),
             S("text", { x: x(i), y: y + 62, class: "s" }, by[q] ? pct(by[q].ro, 1) + " misread" : ""));
    svg.append(g);
  });
  return svg;
}

/* ---------- chart ---------- */
function driftChart(runs) {
  const W = 600, H = 230, L = 62, R = 16, T = 14, B = 34;
  const meas = runs.map(r => med(r.qubits.map(q => q.ro)));
  const rep = runs.map(r => { const v = r.qubits.map(q => q.ro_rep).filter(x => x != null); return v.length ? med(v) : null; });
  const max = Math.max(...meas, ...rep.filter(v => v != null)) * 1.25 || 1;
  const x = i => L + (runs.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (runs.length - 1));
  const y = v => T + (1 - v / max) * (H - T - B);
  const svg = S("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Median readout error over time, measured and reported" });
  [0, .5, 1].forEach(f => { const v = max * f;
    svg.append(S("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "currentColor", "stroke-opacity": .12 }), S("text", { x: 4, y: y(v) + 4 }, pct(v))); });
  const path = vals => vals.map((v, i) => v == null ? "" : `${i ? "L" : "M"}${x(i)},${y(v)}`).join("");
  if (runs.length > 1) {
    svg.append(S("defs", {}, S("linearGradient", { id: "ag", x1: 0, y1: 0, x2: 0, y2: 1 },
      S("stop", { offset: "0%", "stop-color": "var(--a)", "stop-opacity": .35 }), S("stop", { offset: "100%", "stop-color": "var(--a)", "stop-opacity": 0 }))));
    svg.append(S("path", { d: path(meas) + `L${x(runs.length - 1)},${y(0)}L${x(0)},${y(0)}Z`, fill: "url(#ag)" }));
  }
  svg.append(S("path", { d: path(rep), class: "ln rep", stroke: "var(--b)" }));
  svg.append(S("path", { d: path(meas), class: "ln draw", stroke: "var(--a)", pathLength: 1 }));
  const lab = runs.map(r => r.timestamp_utc.slice(5, 10));
  [0, runs.length - 1].forEach((i, k) => { if (k && runs.length === 1) return; svg.append(S("text", { x: x(i), y: H - 10, "text-anchor": i ? "end" : "start" }, lab[i])); });
  const wrap = $("div", { class: "chartwrap" }, svg), tip = $("div", { class: "tip" });
  wrap.append(tip);
  runs.forEach((r, i) => {
    [[meas[i], "var(--a)"], [rep[i], "var(--b)"]].forEach(([v, c]) => {
      if (v == null) return;
      const dot = S("circle", { cx: x(i), cy: y(v), r: 5, fill: c, stroke: "var(--bg)", "stroke-width": 2, tabindex: 0 });
      const show = () => { const bb = svg.getBoundingClientRect(), k = bb.width / W;
        tip.innerHTML = `<b>${r.timestamp_utc.slice(0, 16).replace("T", " ")} UTC</b><br>measured ${pct(meas[i])}<br>IBM reported ${rep[i] == null ? "n/a" : pct(rep[i])}`;
        tip.style.left = x(i) * k + "px"; tip.style.top = y(v) * k + "px"; tip.classList.add("on"); };
      dot.addEventListener("pointerenter", show); dot.addEventListener("focus", show);
      dot.addEventListener("pointerleave", () => tip.classList.remove("on")); dot.addEventListener("blur", () => tip.classList.remove("on"));
      svg.append(dot);
    });
  });
  return wrap;
}

/* ---------- run picker (glass menu, grouped by chip, newest first) ---------- */
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const runDate = r => { const d = new Date(r.timestamp_utc); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const runTime = r => r.timestamp_utc.slice(11, 16) + " UTC";
let closeOpenPicker = null;
function runPicker() {
  const wrap = $("div", { class: "rp" });
  const btn = $("button", { class: "rp-btn", type: "button", "aria-haspopup": "listbox", "aria-expanded": "false", "aria-label": "Choose a run to inspect" },
    `${runDate(runs[sel])} · ${runTime(runs[sel])} · ${runs[sel].backend}`, $("i", { class: "cv", "aria-hidden": "true" }));
  const menu = $("div", { class: "rp-menu", role: "listbox", "aria-label": "Recorded runs", tabindex: -1 });
  const latest = runs.length - 1, order = runs.map((_, i) => i).reverse(), chips = [...new Set(order.map(i => runs[i].backend))];
  const opts = [];
  chips.forEach(chip => {
    menu.append($("div", { class: "rp-grp", role: "presentation" }, chip));
    order.filter(i => runs[i].backend === chip).forEach(i => {
      const o = $("button", { class: "rp-opt", type: "button", role: "option", "aria-selected": String(i === sel), tabindex: -1, "data-i": i },
        $("span", { class: "ck", "aria-hidden": "true" }, "✓"),
        $("span", {}, runDate(runs[i]), " ", $("small", {}, runTime(runs[i]))),
        i === latest ? $("span", { class: "rp-tag" }, "latest") : $("span"));
      o.addEventListener("click", () => pick(i));
      opts.push(o); menu.append(o);
    });
  });
  let act = 0;
  const focusOpt = k => { act = (k + opts.length) % opts.length; opts.forEach((o, j) => o.classList.toggle("act", j === act)); opts[act].focus(); };
  const open = () => { if (closeOpenPicker) closeOpenPicker(); wrap.classList.add("open"); btn.setAttribute("aria-expanded", "true");
    focusOpt(opts.findIndex(o => o.getAttribute("aria-selected") === "true")); closeOpenPicker = close; };
  const close = (refocus) => { wrap.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); closeOpenPicker = null; if (refocus) btn.focus(); };
  const pick = i => { close(false); if (i !== sel) { sel = i; firstDraw = false; build(); } document.querySelector(".rp-btn")?.focus(); };
  btn.addEventListener("click", () => wrap.classList.contains("open") ? close(true) : open());
  btn.addEventListener("keydown", e => { if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); open(); } });
  menu.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); focusOpt(act + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); focusOpt(act - 1); }
    else if (e.key === "Home") { e.preventDefault(); focusOpt(0); }
    else if (e.key === "End") { e.preventDefault(); focusOpt(opts.length - 1); }
    else if (e.key === "Escape" || e.key === "Tab") { close(e.key === "Escape"); }
  });
  wrap.append(btn, menu);
  return wrap;
}
document.addEventListener("pointerdown", e => { if (closeOpenPicker && !e.target.closest(".rp")) closeOpenPicker(); });

/* ---------- build the page ---------- */
function build() {
  const run = runs[sel], s = run.calibration_summary, ratio = s.median_readout_measured_over_reported;
  // different chips must not share one trend line or one average
  const devRuns = runs.filter(r => r.backend === run.backend), otherDev = runs.length - devRuns.length;
  const app = document.getElementById("app");
  const cards = [];
  const pane = (id, cls, ...kids) => $("section", { id, class: "pane rv " + cls }, ...kids);
  let delay = 0; const D = () => `--d:${(delay += .08).toFixed(2)}s`;

  // status chips
  const status = document.getElementById("status");
  const sel_ = runPicker();
  status.replaceChildren(
    $("span", { class: "chip" }, $("i", { class: "dot" }), "Real hardware: " + run.backend),
    $("span", { class: "chip" }, runs.length + " real run" + (runs.length === 1 ? "" : "s") + " recorded"),
    runs.length > 1 ? $("span", { class: "chip", style: "padding:2px 3px 2px 11px" }, "Run", sel_) : null);

  // advice
  const best = run.layouts.best.cost, naive = run.layouts.naive.cost, vend = run.layouts.vendor ? run.layouts.vendor.cost : null;
  const mx = Math.max(best, naive, vend || 0);
  const costRow = (name, v, c, d) => $("div", { class: "fx", style: "grid-template-columns:110px 1fr 56px;padding:5px 0" }, $("span", { class: "nm" }, name),
    $("div", { class: "bar2" }, $("i", { style: `--w:${v / mx * 100}%;--c:${c};--d:${d}s` })), $("span", { class: "vl" }, v.toFixed(3)));
  const LNAME = { best: "Our pick", vendor: "IBM's numbers", naive: "First 5 qubits" };
  const lays = ["best", "vendor", "naive"].filter(l => run.layouts[l]);
  const rawOf = (l, b) => run.results.find(x => x.layout === l && x.benchmark === b);
  const cell = r => { if (!r) return "n/a"; const ci = r.scores.ci95 && r.scores.ci95.raw;
    return r.scores.raw.toFixed(3) + (ci ? ` ±${((ci[1] - ci[0]) / 2).toFixed(3)}` : ""); };
  cards.push(pane("advice", "c6", $("h2", {}, "Today's advice"),
    $("div", { class: "muted" }, `${run.backend} · ${run.timestamp_utc.slice(0, 16).replace("T", " ")} UTC`),
    $("p", { style: "margin:10px 0 0" }, "Use these qubits (best connected chain, by measured error):"),
    chainSvg(run),
    $("p", { class: "muted", style: "margin:12px 0 6px" }, "Chain cost (lower is better)"),
    costRow("Our pick", best, "var(--good)", .3),
    vend != null ? costRow("IBM's numbers", vend, "var(--b)", .38) : null,
    costRow("First 5 qubits", naive, "var(--muted)", .45),
    $("p", { class: "muted", style: "margin:14px 0 6px" }, "What actually happened (raw score, 1.0 = perfect)"),
    $("table", { class: "sc" }, $("tr", {}, $("th", {}, "Chain"), $("th", {}, "GHZ"), $("th", {}, "mirror")),
      lays.map(l => $("tr", {}, $("td", {}, LNAME[l] + " ", $("small", {}, run.layouts[l].chain.map(q => "q" + q).join(" "))),
        $("td", {}, cell(rawOf(l, "ghz"))), $("td", {}, cell(rawOf(l, "mirror")))))),
    vend == null ? $("p", { class: "note" }, "Runs before 2026-10-13 did not test the chain IBM's own numbers would pick.") : null));

  // datasheet
  const pos = Math.max(2, Math.min(98, (Math.log(ratio / .5) / Math.log(4)) * 100));
  const bigEl = $("div", { class: "big" }, "0.00×");
  cards.push(pane("datasheet", "c6", $("h2", {}, "Does reality match the datasheet?"),
    $("div", { class: "muted" }, "median measured readout error ÷ IBM-reported (1.0× = agree)"),
    $("div", { style: "margin-top:12px" }, bigEl),
    $("div", { class: "meter", style: `--x:${pos}%` }, $("i", { class: "mk" })),
    $("div", { class: "meter-l" }, $("span", {}, "better than advertised"), $("span", {}, "agree"), $("span", {}, "worse than advertised")),
    $("h2", { style: "margin-top:20px;font-size:.95rem" }, "Worst offenders"),
    ...(() => { const wq = (s.worst_readout_qubits || []).slice(0, 3), m = Math.max(...wq.flatMap(w => [w.measured, w.reported])) || 1;
      return wq.map((w, i) => $("div", { class: "qr", style: "grid-template-columns:54px 1fr" }, $("span", { class: "id" }, "q" + w.qubit),
        $("div", {}, $("div", { class: "bar2" }, $("i", { style: `--w:${Math.max(w.measured / m * 100, 1.5)}%;--c:var(--bad);--d:${.3 + i * .12}s` })),
          $("div", { class: "bar2", style: "height:6px;margin-top:4px" }, $("i", { style: `--w:${Math.max(w.reported / m * 100, 1.5)}%;--c:var(--muted);--d:${.4 + i * .12}s` })),
          $("div", { class: "g" }, $("span", {}, "measured " + pct(w.measured)), $("span", {}, "IBM says " + pct(w.reported)))))); })()));
  bigEl.dataset.to = ratio;

  // fixes
  const bestRes = devRuns.flatMap(r => r.results.filter(x => x.layout === "best"));
  const usable = bestRes.filter(x => x.scores.zne_ok !== false && x.scores.zne != null && x.scores["readout+zne"] != null);
  const methods = [["raw", "do nothing special"], ["readout", "undo reading mistakes"], ["zne", "add noise on purpose, extrapolate to zero"], ["readout+zne", "both together"]];
  if (!usable.length) { cards.push(pane("fixes", "c12", $("h2", {}, "Which error fix works best?"), $("p", { class: "muted" }, "No usable results on this chip yet."))); }
  else { const rows = methods.map(([m, d]) => {
    const sc = usable.map(x => x.scores[m]);
    return { m, d, mean: sc.reduce((a, b) => a + b, 0) / sc.length };
  });
  const bestM = rows.reduce((a, b) => b.mean > a.mean ? b : a), rawErr = 1 - rows[0].mean, maxErr = rawErr || 1;
  cards.push(pane("fixes", "c12", $("h2", {}, "Which error fix works best?"),
    $("div", { class: "muted" }, `Bars show how often the answer was WRONG (shorter is better). Average over ${devRuns.length} run(s) on ${run.backend}, best chain, benchmarks with a known correct answer.`),
    $("div", { style: "margin-top:8px" }, rows.map((r, i) => {
      const err = 1 - r.mean;
      return $("div", { class: "fx" + (r === bestM ? " best" : "") },
        $("div", { class: "nm" }, r.m, $("small", {}, r.d)),
        $("div", { class: "bar2", role: "img", "aria-label": `${r.m}: ${pct(err, 1)} wrong` }, $("i", { style: `--w:${Math.max(err / maxErr * 100, 1.5)}%;--c:${r === bestM ? "var(--good)" : "var(--a)"};--d:${.15 + i * .15}s` })),
        $("div", { class: "vl" }, `score ${r.mean.toFixed(3)} · ${pct(err, 1)} wrong` + (r.m === "raw" ? "" : ` · ${(100 * (err - rawErr) / rawErr).toFixed(0)}%`)));
    })),
    $("p", { class: "note" }, "Percentage = change in mistakes compared with raw. " + devRuns.length + " run(s) on this chip so far: treat this as a first look."
      + (bestRes.length > usable.length ? ` ${bestRes.length - usable.length} result(s) left out: adding noise did not lower the score there, so zero-noise extrapolation means nothing.` : "")
      + " ZNE scores of exactly 1.000 are the extrapolation clipped at 1, not a perfect chip."))); }

  // drift
  cards.push(pane("drift", "c12", $("h2", {}, "Drift: median readout error over time on " + run.backend),
    $("div", { class: "legend" }, $("span", {}, $("i", { style: "background:var(--a)" }), "measured by us (solid)"), $("span", {}, $("i", { style: "background:var(--b)" }), "reported by IBM (dashed)"),
      $("span", {}, devRuns.length + " run(s) on this chip" + (devRuns.length < 4 ? " · a trend needs several weekly runs" : "")
        + (otherDev ? ` · ${otherDev} run(s) on other chips hidden (pick one in the run selector)` : ""))),
    driftChart(devRuns)));

  // qubits
  const qs = [...run.qubits].sort((a, b) => a.ro - b.ro), pick = [...qs.slice(0, 5), ...qs.slice(-5)];
  const qmax = Math.max(...pick.map(q => Math.max(q.ro, q.ro_rep || 0))) || 1;
  cards.push(pane("qubits", "c12", $("h2", {}, "Five best and five worst qubits (this run)"),
    $("div", { class: "legend" }, $("span", {}, $("i", { style: "background:var(--good)" }), "under 1%"), $("span", {}, $("i", { style: "background:var(--warn)" }), "1% to 5%"), $("span", {}, $("i", { style: "background:var(--bad)" }), "over 5%"), $("span", {}, "(measured readout error)")),
    $("div", { class: "qh" }, $("span", {}, "Qubit"), $("span", {}, "Readout error: measured vs IBM-reported"), $("span", {}, "1q gate sequence (ours) vs IBM single gate (not comparable)")),
    pick.map((q, i) => $("div", { class: "qr" },
      $("span", { class: "id" }, "q" + q.q),
      $("div", {}, $("div", { class: "bar2" }, $("i", { style: `--w:${Math.max(q.ro / qmax * 100, 1.5)}%;--c:${tone(q.ro)};--d:${.1 + i * .06}s` })),
        $("div", { class: "g" }, $("span", {}, "measured " + pct(q.ro)), $("span", {}, "IBM " + pct(q.ro_rep)))),
      $("div", { class: "g", style: "margin-top:0;justify-content:flex-start;gap:14px;font-size:.9rem" }, $("span", { style: "color:var(--ink)" }, "ours " + pct(q.g1)), $("span", {}, "IBM " + pct(q.g1_rep))))),
    $("p", { class: "note" }, "The “1q gate sequence” is the decay over 100 repeated gates on all qubits at once, so it also contains qubit decay and crosstalk. It is NOT comparable with IBM’s single-gate figure and is used only to rank qubits.")));

  cards.push($("p", { class: "muted foot c12 rv", style: "grid-column:1/-1" },
    "Scores are the probability of the known-correct output; ± is the 95% range from shot noise alone (newer runs only). The GHZ score only counts all-0 / all-1 outcomes, so it catches bit flips but cannot tell whether the entanglement survived. Two-qubit gate errors used for choosing a chain come from a quick repeated-gate decay test (an estimate, not randomized benchmarking). One chip on one day: do not over-generalize."));

  app.replaceChildren(...cards);
  watchReveal(); countUp(bigEl, ratio, v => v.toFixed(2) + "×", firstDraw ? 1300 : 600);
  if (!firstDraw) cards.forEach(c => c.classList.add("in"));
}

/* ---------- reveal, sheen, magnetic, lens, progress, theme ---------- */
let io = null;
function watchReveal() {
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
}
function mount() {
  // letter-by-letter heading (visible at rest until armed)
  const h = document.querySelector("[data-split]"), text = h.textContent; h.setAttribute("aria-label", text); h.textContent = ""; let n = 0;
  text.split(/(\s+)/).forEach(w => { if (!w) return; if (/^\s+$/.test(w)) { h.append(" "); return; }
    const word = $("span", { class: "w", "aria-hidden": "true" }); for (const c of w) word.append($("span", { class: "ch", style: `--c:${n++}` }, c)); h.append(word); });
  requestAnimationFrame(() => { root.classList.add("armed"); h.classList.add("in"); });
  setInterval(() => document.querySelectorAll(".rv:not(.in)").forEach(el => { const r = el.getBoundingClientRect(); if (r.top < innerHeight * .95 && r.bottom > 0) el.classList.add("in"); }), 700);

  // cursor sheen on glass
  addEventListener("pointermove", e => { for (const p of document.querySelectorAll(".pane, .bar")) { const r = p.getBoundingClientRect();
    if (e.clientY < r.top - 240 || e.clientY > r.bottom + 240) continue; p.style.setProperty("--mx", (e.clientX - r.left) + "px"); p.style.setProperty("--my", (e.clientY - r.top) + "px"); } }, { passive: true });
  // magnetic toolbar pills (mouse only)
  document.addEventListener("pointermove", e => { const b = e.target.closest?.(".pill"); if (!b || reduced() || e.pointerType !== "mouse") return; const r = b.getBoundingClientRect();
    b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .18}px, ${(e.clientY - r.top - r.height / 2) * .25}px)`; }, { passive: true });
  document.addEventListener("pointerout", e => { const b = e.target.closest?.(".pill"); if (b) b.style.transform = ""; }, { passive: true });

  // Chromium lens on the toolbar
  if (/Chrome\//.test(navigator.userAgent)) {
    const N = 128, c = document.createElement("canvas"); c.width = c.height = N; const g = c.getContext("2d"), img = g.createImageData(N, N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const u = x / (N - 1) * 2 - 1, v = y / (N - 1) * 2 - 1, i = (y * N + x) * 4,
      ex = Math.max(0, Math.abs(u) - .55) / .45, ey = Math.max(0, Math.abs(v) - .3) / .7;
      img.data[i] = 128 - Math.sign(u) * ex * ex * 127; img.data[i + 1] = 128 - Math.sign(v) * ey * ey * 127; img.data[i + 2] = 128; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0);
    const w = document.createElement("div");
    w.innerHTML = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="lg-liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feImage href="${c.toDataURL()}" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/><feDisplacementMap in="SourceGraphic" in2="map" scale="22" xChannelSelector="R" yChannelSelector="G"/></filter></svg>`;
    document.body.append(w.firstElementChild); root.classList.add("lens");
  }

  // progress line + active section in the toolbar
  const bar = document.querySelector(".progress"), links = [...document.querySelectorAll('.bar a[href^="#"]')];
  const tick = () => { const max = root.scrollHeight - innerHeight; bar.style.setProperty("--p", max > 0 ? Math.min(1, scrollY / max) : 0);
    let cur = null, best = -1e9; links.forEach(a => { const s = document.querySelector(a.getAttribute("href")); if (!s) return; const t = s.getBoundingClientRect().top; if (t < innerHeight * .4 && t > best) { best = t; cur = a; } });
    links.forEach(a => a.classList.toggle("on", a === cur)); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);

  // theme toggle (remembered if the browser allows)
  const btn = document.getElementById("theme");
  try { const t = localStorage.getItem("qwr-theme"); if (t) root.setAttribute("data-theme", t); } catch {}
  btn.addEventListener("click", () => {
    const dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
    const next = dark ? "light" : "dark"; root.setAttribute("data-theme", next); try { localStorage.setItem("qwr-theme", next); } catch {} });
}

/* ---------- start ---------- */
(async function main() {
  mount();
  const app = document.getElementById("app");
  try { hist = await (await fetch("data/history.json", { cache: "no-store" })).json(); }
  catch { app.replaceChildren($("div", { class: "pane c12 empty" }, "Could not load data/history.json")); return; }
  runs = hist.runs || [];
  if (!runs.length) {
    app.replaceChildren($("div", { class: "pane c12 empty rv" },
      $("h2", {}, "No real quantum-computer runs yet"),
      $("p", { class: "muted" }, "Nothing is shown until a real QPU run is recorded. Simulator results are never published here.")));
    watchReveal(); return;
  }
  sel = runs.length - 1; build(); firstDraw = false;
})();
</script>
